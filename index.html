<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD Change Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1 class="brand">CAD Change Log<small>Fusion 360 · design revisions</small></h1>
  <span class="sp"></span>
  <span id="where" class="hint mono where"></span>
  <button class="btn primary" type="button" data-act="new-part">+ New part</button>
</header>
<div id="banner" class="banner" hidden></div>

<div class="shell">
  <aside class="side">
    <input id="q" class="search" type="search" placeholder="Search parts, revisions, parameters, issues" aria-label="Search">
    <section id="caps" hidden></section>
    <div class="side-h"><span>Parts, assemblies &amp; PCBs</span><span id="pcount" class="mono"></span></div>
    <ul id="plist" class="plist"></ul>
  </aside>
  <main class="main"><div class="main-in" id="view"></div></main>
</div>

<div id="ov" class="ov" hidden></div>
<script src="/static/pcb.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
